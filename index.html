    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Shanti",
            "url": "https://psicostatus.netlify.app/",
            "inLanguage": "es-AR",
            "description": "Seguimiento diario para psicólogos y psiquiatras."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Shanti",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "Web",
            "url": "https://psicostatus.netlify.app/",
            "image": "https://psicostatus.netlify.app/og.png",
            "inLanguage": "es-AR",
            "description": "El profesional arma las preguntas e invita con un link. La persona responde en el teléfono; el consultorio ve el tablero, el historial y la reportería.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ARS" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Qué es Shanti?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Shanti es una herramienta web para el seguimiento entre sesiones. La persona responde en el teléfono; el profesional ve el tablero en la computadora."
                }
              },
              {
                "@type": "Question",
                "name": "¿Reemplaza la historia clínica?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Es un complemento para el seguimiento cotidiano, no una historia clínica ni un diagnóstico. El uso clínico queda a cargo del profesional."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cómo entro si soy paciente?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Con el link que te manda tu profesional. Ahí creás la cuenta o ingresás si ya la tenés. Si todavía no te lo pasó, pedíselo: es la forma de quedar vinculado a tu consultorio."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué puede hacer el profesional?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Crear el espacio, armar plantillas, invitar con un link, ver quién cargó, leer el historial completo, dejar notas privadas, mirar gráficos, descargar CSV y, si hay equipo, sumar colegas con distintos roles."
                }
              },
              {
                "@type": "Question",
                "name": "¿Puedo usar una plantilla distinta para cada persona?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí. Hay una plantilla por defecto para quienes se suman y para las personas activas, y en la ficha de cada una podés elegir otro cuestionario."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuánto cuesta?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Es gratis para empezar. Te registrás con mail o Google, en unos minutos tenés consultorio y un formulario listo para compartir."
                }
              }
            ]
          }
        ]
      }
    </script>
